databaseChangeLog:
  - changeSet:
      id: 1
      author: admin

      changes:
        - createTable:
            tableName: cars

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: model
                  type: VARCHAR(255)

              - column:
                  name: producer
                  type: VARCHAR(255)

              - column:
                  name: power
                  type: DOUBLE